<div id="{{ id }}" class="modal" role="dialog" aria-modal="true" aria-label="Project details">
  <div class="modal-background" data-modal-close></div>
  <div class="modal-content">
    <button type="button" class="close-modal btn" data-modal-close aria-label="Close modal">×</button>
    <div class="header">
      <p class="date">{{ project.date }}</p>
      <h3 class="title">{{ project.title }}</h3>
      <p class="summary">{{ project.summary }}</p>
    </div>
    <div class="content">
      {% if project.image %}
        <img src="{{ project.image.path | prepend: '/assets/project/' | relative_url }}" alt="{{ project.image.alt | default: project.title }}" loading="lazy" decoding="async">
      {% endif %}
      <div class="description">{{ project.description }}</div>
      {% for content in project.contents %}
      <div class="sub-content">
        <h4 class="title">{{ content.title }}</h4>
        {% if content.image %}
          <img src="{{ content.image.path | prepend: '/assets/project/' | relative_url }}" alt="{{ content.image.alt | default: content.title }}" loading="lazy" decoding="async">
        {% endif %}
        <div class="description">{{ content.description }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
