{% assign profile = site.data.profile %}
{% assign urlstart = profile.image | split: '/' %}
{% if urlstart == 'https:' %}
  {% assign imgurl = profile.image %}
{% else %}
  {% assign imgurl = profile.image | relative_url %}
{% endif %}

<div id="profile">
  <a href="{{ '/' | relative_url }}">
    <div class="img-wrap">
      <img src="{{ imgurl }}" alt="{{ profile.username }}" width="180" height="180" loading="lazy" decoding="async">
    </div>
  </a>
  <p class="username">{{ profile.username }}</p>
  <ul class="social-links" aria-label="Profile links">
    {% include social.html %}
  </ul>
</div>
